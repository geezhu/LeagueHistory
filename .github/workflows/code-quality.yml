name: Fork code quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Verify upstream exclusions
        shell: pwsh
        run: ./Tests/CodeQualityChecks.ps1
      - name: Check fork-added changes and adopted examples
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          $baseRef = if ($env:EVENT_NAME -eq 'pull_request') { $env:PR_BASE } else { $env:PUSH_BASE }
          if (!$baseRef -or $baseRef -match '^0+$') { $baseRef = 'HEAD' }
          ./Scripts/Check-CodeQuality.ps1 -BaseRef $baseRef
      - name: Verify voice lifecycle
        shell: pwsh
        run: |
          $checks = 'Tests/StatisticsChecks/bin/Release/net8.0-windows/StatisticsChecks.dll'
          foreach ($flag in @('--sensevoice-checks', '--assistant-voice-checks', '--gamebar-voice-checks')) {
            dotnet $checks $flag
            if ($LASTEXITCODE -ne 0) { throw "Voice check failed: $flag" }
          }
      - name: Verify shutdown state transitions on Windows PowerShell 5.1
        shell: powershell
        run: ./Tests/ShutdownScriptChecks.ps1
      - name: Save analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-reports
          path: bin/code-quality
          if-no-files-found: ignore
