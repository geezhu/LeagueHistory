name: Code quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Verify upstream exclusions
        shell: pwsh
        run: ./Tests/CodeQualityChecks.ps1
      - name: Check all sources outside the baseline
        shell: pwsh
        run: ./Scripts/Check-CodeQuality.ps1
      - name: Verify voice lifecycle
        shell: pwsh
        run: |
          $checks = 'bin/code-quality/build/StatisticsChecks/StatisticsChecks.dll'
          foreach ($flag in @('--sensevoice-checks', '--assistant-voice-checks', '--gamebar-voice-checks')) {
            dotnet $checks $flag
            if ($LASTEXITCODE -ne 0) { throw "Voice check failed: $flag" }
          }
      - name: Verify shutdown state transitions on Windows PowerShell 5.1
        shell: powershell
        run: ./Tests/ShutdownScriptChecks.ps1
      - name: Save analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-reports
          path: bin/code-quality
          if-no-files-found: ignore
